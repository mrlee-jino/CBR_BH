project_id = "puyohub"
[api]
enabled = true
port = 54321
schemas = ["public"]
extra_search_path = ["public", "extensions"]
max_rows = 100
[db]
port = 54322
shadow_port = 54320
major_version = 15
[db.migrations]
enabled = true
[db.seed]
enabled = true
sql_paths = ["./seed.sql"]
[realtime]
enabled = false
[studio]
enabled = false
[local_smtp]
enabled = true
port = 54324
[storage]
enabled = true
file_size_limit = "5MiB"
[storage.s3_protocol]
enabled = false
[storage.vector]
enabled = false
[auth]
enabled = true
site_url = "http://127.0.0.1:3000"
additional_redirect_urls = ["http://127.0.0.1:3000/auth/confirm", "http://localhost:3000/auth/confirm"]
enable_signup = true
minimum_password_length = 8
enable_refresh_token_rotation = true
[auth.rate_limit]
email_sent = 100
sign_in_sign_ups = 100
[auth.email]
enable_signup = true
enable_confirmations = true
double_confirm_changes = true
max_frequency = "1s"
[auth.email.template.confirmation]
subject = "Confirm your PuyoHub account"
content_path = "./supabase/templates/confirmation.html"
[auth.email.template.recovery]
subject = "Reset your PuyoHub password"
content_path = "./supabase/templates/recovery.html"
[auth.mfa.totp]
enroll_enabled = true
verify_enabled = true
[edge_runtime]
enabled = false
[analytics]
enabled = false
