name: Application checks

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm install --global npm@11.9.0
      - run: npm ci
      - run: npm run db:start
      - run: npm run db:reset
      - run: npm run test:setup
      - run: npm run db:types && git diff --exit-code src/lib/supabase/database.types.ts
      - run: npm run db:bundle && git diff --exit-code supabase/bootstrap.sql supabase/upgrade-listings.sql supabase/upgrade-photos.sql supabase/upgrade-requests.sql supabase/upgrade-experience.sql supabase/upgrade-auth.sql supabase/upgrade-admin.sql supabase/upgrade-reporting.sql supabase/upgrade-admin-password.sql
      - run: npx playwright install --with-deps chromium
      - run: npm run check
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: browser-test-results
          path: |
            playwright-report/
            test-results/
          retention-days: 7
